<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0e1319" />
    <meta name="color-scheme" content="dark light" />
    <meta name="description" content="Claude Forge — an offline-capable academy for mastering Claude Code Skills with exercises, experiments and evidence." />
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <link rel="apple-touch-icon" href="./icon.svg" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <title>Claude Forge</title>
    <script>
      // Apply the saved theme before first paint to avoid a flash. localStorage may be blocked: fail quietly.
      try {
        var t = localStorage.getItem('forge.theme') || 'dark';
        var m = localStorage.getItem('forge.motion') || 'system';
        var dark = t === 'dark' || (t === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
        document.documentElement.setAttribute('data-motion', m);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Claude Forge needs JavaScript. It is a static app: nothing is sent to a server.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
